<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Starlight Robotics curates accessible reference libraries for curious people.">
    <title>{% if page.title %}{{ page.title }} · {% endif %}Starlight Robotics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
    <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}" type="image/x-icon">
</head>
<body>
    <header class="site-header">
        <div class="site-shell nav-shell">
            <a class="brand" href="{{ '/' | relative_url }}" aria-label="Starlight Robotics home">
                <img src="{{ '/images/logo.png' | relative_url }}" alt="Starlight Robotics">
            </a>
            <nav class="site-nav" aria-label="Primary navigation">
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="{{ '/projects.html' | relative_url }}">Libraries</a>
                <a href="{{ '/about.html' | relative_url }}">About</a>
                <a class="nav-cta" href="https://www.reddit.com/r/starlightrobotics/">Community <span aria-hidden="true">↗</span></a>
            </nav>
        </div>
    </header>

    <main>
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="site-shell footer-grid">
            <div>
                <a class="footer-mark" href="{{ '/' | relative_url }}">Starlight Robotics</a>
                <p>Independent reference libraries for exploring knowledge, one useful page at a time.</p>
            </div>
            <div class="footer-links">
                <a href="https://www.instagram.com/starlightrobotics/">Instagram</a>
                <a href="https://twitter.com/starlightrobotx">X / Twitter</a>
                <a href="https://www.reddit.com/r/starlightrobotics/">Reddit</a>
            </div>
        </div>
        <div class="site-shell footer-base">
            <span>© 2023–{{ 'now' | date: '%Y' }} Starlight Robotics</span>
            <span>Explore · Discover · Shine</span>
        </div>
    </footer>
</body>
</html>
